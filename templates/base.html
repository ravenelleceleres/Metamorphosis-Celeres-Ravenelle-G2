<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Metamorphosis{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #ddd; }
    .alert { padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 4px; background: #eef4ff; }
    .alert.success { background: #e6f7ed; }
    .alert.error { background: #fdeaea; }
    .field { margin-bottom: 0.9rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav>
    <strong>Metamorphosis</strong>
    {% if user.is_authenticated %}
      <a href="{% url 'accounts:dashboard_redirect' %}">Dashboard</a>
      <a href="{% url 'accounts:profile' %}">Profile</a>
      <a href="{% url 'conversions:list' %}">PHP Converter</a>
      <form method="post" action="{% url 'accounts:logout' %}" style="display:inline; margin-left:auto;">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <a href="{% url 'accounts:login' %}">Login</a>
      <a href="{% url 'accounts:register' %}">Register</a>
    {% endif %}
  </nav>

  {% if messages %}
    {% for message in messages %}
      <div class="alert {{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
